name: Build Clawd Companion

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-arm64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ClawdCompanion/ClawdCompanion.csproj -r ${{ matrix.rid }}

      - name: Publish single-file exe
        run: >
          dotnet publish ClawdCompanion/ClawdCompanion.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: Rename exe
        shell: pwsh
        run: |
          Copy-Item "publish/${{ matrix.rid }}/ClawdCompanion.exe" "ClawdCompanion-${{ matrix.rid }}.exe"
          Get-Item "ClawdCompanion-${{ matrix.rid }}.exe" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClawdCompanion-${{ matrix.rid }}
          path: ClawdCompanion-${{ matrix.rid }}.exe
          if-no-files-found: error

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ClawdCompanion-${{ matrix.rid }}.exe
